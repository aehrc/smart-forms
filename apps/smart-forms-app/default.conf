## nginx/default.conf
server {
  # Nginx listens on port 80 by default. You can change this if needed.
  listen 80;

  # Specifies your domain. Use "localhost" for local development or your domain name for production.
  server_name localhost;

  # The root directory that contains the `dist` folder generated after building your app.
  root /usr/share/nginx/html;
  index index.html;

  # Serve the hashed build output (JS, CSS, fonts). A new build gives these files new names,
  # so they can be cached for good. A missing file is a 404 rather than index.html served
  # in place of a script, which makes a page from an older build easy to diagnose.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Serve all routes and pages
  # Use the base name to serve all pages. In this case, the base name is "/".
  # index.html and config.json are revalidated on every load, so a new deployment is picked up
  # straight away instead of the browser reusing a cached index.html that points to old assets.
  location / {
    try_files $uri /index.html =404;
    add_header Cache-Control "no-cache";
  }

  # Example: If your base name is "/example", the location block will look like this:
  # location /example {
  #   rewrite ^/example(/.*) $1 break;
  #   try_files $uri /index.html =404;
  # }
}